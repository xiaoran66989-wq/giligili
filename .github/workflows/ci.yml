name: Go CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Run package tests
        run: go test ./...
      - name: Build server
        run: go build ./...
      - name: Boot stack and verify website
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml.example up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              curl --fail --silent http://localhost:3000/ | grep -q 'G站视频'
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml.example logs
          exit 1
      - name: Stop stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.yml.example down -v
          fi
