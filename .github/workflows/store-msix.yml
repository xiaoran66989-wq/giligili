name: Store MSIX Package

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package identity name from Partner Center"
        required: true
        type: string
      publisher:
        description: "Exact Publisher value from Partner Center"
        required: true
        type: string
      publisher_display_name:
        description: "Publisher display name"
        required: true
        type: string
      package_version:
        description: "Four-part version, such as 1.0.0.0"
        required: true
        default: "1.0.0.0"
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Resolve dependencies
        run: go mod tidy
      - name: Build Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags="-s -w" -o build/giligili.exe .
      - name: Package MSIX for Store submission
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ inputs.identity_name }}
          PACKAGE_PUBLISHER: ${{ inputs.publisher }}
          PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          ./installer/msix/Build-MSIX.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PACKAGE_PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -Version $env:PACKAGE_VERSION
      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: Giligili-Store-MSIX-${{ inputs.package_version }}
          path: dist/Giligili-Store.msix
          if-no-files-found: error
          retention-days: 30
