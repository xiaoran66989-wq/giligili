<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="description" content="G站视频 - 发现、观看与分享视频">
<title>G站视频 · 发现好内容</title>
<style>
:root{--bg:#111318;--panel:#191c24;--panel2:#20242e;--text:#f4f5f8;--muted:#9ba2b2;--line:#ffffff15;--brand:#f4a340;--blue:#56a4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{width:min(1240px,calc(100% - 36px));margin:auto}
header{position:sticky;top:0;z-index:3;background:#111318ed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.top{min-height:70px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;white-space:nowrap}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(140deg,#ffbd62,#e78127);color:#23180d;font-size:18px}.nav{display:flex;gap:20px;color:#c7cbd4}.nav a:hover,.nav a.active{color:var(--brand)}.search{margin-left:auto;position:relative;max-width:360px;flex:1}.search input{width:100%;border:1px solid var(--line);background:#ffffff0c;color:var(--text);border-radius:22px;padding:10px 15px 10px 38px;outline:none}.search:before{content:"⌕";position:absolute;left:14px;top:2px;font-size:22px;color:var(--muted)}.account{display:flex;gap:9px;align-items:center;white-space:nowrap}.account-name{color:#c7cbd4;font-size:13px}.btn{border:0;border-radius:20px;padding:9px 15px;background:var(--panel2);color:var(--text)}.btn:hover{filter:brightness(1.13)}.btn-primary{background:var(--brand);color:#24180b;font-weight:750}.btn-link{background:none;color:var(--blue);padding:7px}
main{padding-bottom:50px}.hero{margin:24px 0 35px;border:1px solid var(--line);border-radius:20px;min-height:320px;display:flex;align-items:center;overflow:hidden;position:relative;background:radial-gradient(ellipse at 75% 20%,#e3965c40,transparent 35%),linear-gradient(110deg,#292734,#1c2430 62%,#171a20)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#181922 1%,#181922da 46%,#18192228);pointer-events:none}.hero-art{position:absolute;right:5%;width:38%;height:95%;top:3%;border-radius:55% 55% 5px 5px;background:linear-gradient(140deg,#f2c08666,#87534caa 50%,#24212a);filter:drop-shadow(0 18px 40px #0008)}.hero-copy{position:relative;z-index:1;padding:38px 45px;max-width:690px}.eyebrow{color:var(--brand);font-size:12px;letter-spacing:2px;font-weight:800}.hero h1{font-size:clamp(32px,4vw,50px);line-height:1.15;margin:10px 0}.hero p{max-width:540px;color:#d0d1d8;margin:8px 0 18px}.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.badge{border:1px solid #ffffff2b;border-radius:15px;padding:2px 9px}.hero-actions{display:flex;gap:10px;margin-top:20px}
.head{display:flex;align-items:end;justify-content:space-between;margin:22px 0 15px}.head h2{font-size:22px;margin:0}.head p{font-size:13px;color:var(--muted);margin:4px 0 0}.sorts{display:flex;gap:7px}.sort{background:none;border:0;color:var(--muted);padding:7px 10px;border-radius:16px}.sort.active{background:#f4a34022;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:#f4a34066}.cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:linear-gradient(140deg,#504b60,#272934 64%,#191c24);display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.cover-placeholder{font-size:40px;color:#ffffff36}.play{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border:0;border-radius:50%;background:#111c;color:white;font-size:16px}.card-body{padding:12px 14px 14px}.card h3{font-size:15px;line-height:1.35;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:12px;color:var(--muted);margin:0;height:38px;overflow:hidden}.card-meta{display:flex;justify-content:space-between;color:#9097a5;font-size:11px;margin-top:10px}.empty{grid-column:1/-1;padding:48px 18px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
footer{border-top:1px solid var(--line);color:#838a98;padding:24px 0;font-size:12px}.foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:10;background:#000b;display:none;place-items:center;padding:18px}.overlay.show{display:grid}.dialog{width:min(720px,100%);max-height:94vh;overflow:auto;background:#1b1e26;border:1px solid #ffffff20;border-radius:16px;box-shadow:0 25px 90px #000b}.dialog.wide{width:min(940px,100%)}.dialog-head{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0;font-size:18px}.close{border:0;background:none;color:#d6d8df;font-size:25px}.form{padding:18px;display:grid;gap:13px}.field{display:grid;gap:6px}.field label{color:#c5c9d2;font-size:13px}.field input,.field textarea{width:100%;border:1px solid #ffffff1e;background:#11141a;color:var(--text);border-radius:9px;padding:10px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.notice{padding:10px 12px;border-radius:9px;background:#ffffff0a;color:#c1c6d1;font-size:13px}.error{color:#ff9c9c}.success{color:#8ce1b0}
.player{background:#050608;aspect-ratio:16/9;display:grid;place-items:center;color:#999}.player video{width:100%;height:100%;max-height:70vh;background:#050608}.detail{padding:17px 20px}.detail p{color:#c4c8d1}.hidden{display:none!important}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.nav{gap:12px}.top{gap:16px}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.top{flex-wrap:wrap;padding:11px 0}.brand{font-size:18px}.nav{order:3;width:100%;overflow:auto;padding:4px 0}.search{max-width:none;order:2}.account{margin-left:auto}.account-name{display:none}.hero{min-height:340px}.hero-copy{padding:28px 24px}.hero-art{right:-16%;width:58%;opacity:.6}.hero:after{background:linear-gradient(90deg,#181922f5,#181922bb 75%,#18192255)}.head{align-items:start;flex-direction:column;gap:8px}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.cover{aspect-ratio:1.2}.card-body{padding:10px}.hero h1{font-size:32px}}
</style>
</head>
<body>
<header><div class="wrap top">
<a class="brand" href="/"><span class="logo">G</span><span>G站视频</span></a>
<nav class="nav"><a class="active" href="/">首页</a><a href="#videos">视频</a><a href="/swagger/index.html" target="_blank" rel="noopener">API 文档</a></nav>
<label class="search"><input id="search" type="search" placeholder="搜索视频标题或简介" aria-label="搜索视频"></label>
<div class="account"><span class="account-name" id="accountName"></span><button class="btn" id="loginBtn">登录</button><button class="btn btn-primary hidden" id="uploadBtn">投稿</button><button class="btn btn-link hidden" id="logoutBtn">退出</button></div>
</div></header>
<main class="wrap">
<section class="hero">
<div class="hero-art" aria-hidden="true"></div>
<div class="hero-copy"><div class="eyebrow">发现好内容 · WATCH SOMETHING GOOD</div><h1 id="heroTitle">正在加载视频…</h1><div class="meta"><span id="heroMeta">G站视频精选</span><span class="badge">精选</span></div><p id="heroInfo">视频列表加载后，这里会展示推荐内容。</p><div class="hero-actions"><button class="btn btn-primary" id="heroPlay">▶ 立即播放</button><a class="btn" href="#videos">浏览全部</a></div></div>
</section>
<section id="videos"><div class="head"><div><h2>视频精选</h2><p id="resultCount">正在连接服务…</p></div><div class="sorts"><button class="sort active" data-sort="latest">最新</button><button class="sort" data-sort="popular">最多播放</button></div></div><div class="grid" id="grid"></div></section>
</main>
<footer><div class="wrap foot"><span>© 2026 G站视频 · Go + Gin 视频站示例</span><span>请仅上传你有权发布的视频与封面。</span></div></footer>

<div class="overlay" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountTitle"><div class="dialog"><div class="dialog-head"><h3 id="accountTitle">账号</h3><button class="close" data-close="accountModal" aria-label="关闭">×</button></div><div class="form">
<div class="notice" id="accountNotice">登录后可以投稿和管理自己的视频。</div>
<form id="loginForm" class="form" style="padding:0"><div class="field"><label for="loginUser">用户名</label><input id="loginUser" name="user_name" minlength="5" maxlength="30" autocomplete="username" required></div><div class="field"><label for="loginPass">密码</label><input id="loginPass" name="password" type="password" minlength="8" maxlength="40" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">登录</button></form>
<form id="registerForm" class="form hidden" style="padding:0"><div class="field"><label for="regNick">昵称</label><input id="regNick" name="nickname" minlength="2" maxlength="30" required></div><div class="field"><label for="regUser">用户名（5–30 位）</label><input id="regUser" name="user_name" minlength="5" maxlength="30" autocomplete="username" required></div><div class="field"><label for="regPass">密码（8–40 位）</label><input id="regPass" name="password" type="password" minlength="8" maxlength="40" autocomplete="new-password" required></div><div class="field"><label for="regConfirm">确认密码</label><input id="regConfirm" name="password_confirm" type="password" minlength="8" maxlength="40" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">创建账号</button></form>
<div class="hint" id="accountSwitch">还没有账号？ <button class="btn btn-link" id="showRegister">立即注册</button></div>
</div></div></div>

<div class="overlay" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle"><div class="dialog"><div class="dialog-head"><h3 id="uploadTitle">投稿视频</h3><button class="close" data-close="uploadModal" aria-label="关闭">×</button></div><form class="form" id="uploadForm">
<div class="notice">填写可直接播放的 MP4 地址和封面图片链接。若使用 OSS，请先配置服务端 OSS 环境变量。</div>
<div class="field"><label for="videoTitle">标题</label><input id="videoTitle" name="title" minlength="2" maxlength="100" required></div>
<div class="field"><label for="videoInfo">简介</label><textarea id="videoInfo" name="info" maxlength="3000"></textarea></div>
<div class="field"><label for="videoUrl">视频地址</label><input id="videoUrl" name="url" type="url" placeholder="https://example.com/video.mp4" required></div>
<div class="field"><label for="videoAvatar">封面地址</label><input id="videoAvatar" name="avatar" type="url" placeholder="https://example.com/cover.jpg"></div>
<div class="hint" id="uploadMessage">请使用你有权发布的视频和图片链接。</div>
<button class="btn btn-primary" type="submit">提交投稿</button>
</form></div></div>

<div class="overlay" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="playerTitle"><div class="dialog wide"><div class="dialog-head"><h3 id="playerTitle">视频播放</h3><button class="close" data-close="playerModal" aria-label="关闭">×</button></div><div class="player" id="playerArea"><video id="videoPlayer" controls playsinline preload="metadata"></video></div><div class="detail"><div class="meta" id="playerMeta"></div><p id="playerInfo"></p></div></div></div>
<script>
const $=id=>document.getElementById(id);
const state={videos:[],sort:"latest",user:null,filtered:[]};
function esc(value){return String(value||"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function formatDate(timestamp){if(!timestamp)return "";try{return new Date(Number(timestamp)*1000).toLocaleDateString("zh-CN")}catch(e){return ""}}
async function request(path,options={}){const res=await fetch(path,Object.assign({credentials:"same-origin"},options));let data={};try{data=await res.json()}catch(e){}if(!res.ok||data.status&&data.status!==0)throw new Error(data.msg||"请求失败 ("+res.status+")");return data}
function render(){const query=$("search").value.trim().toLowerCase();let list=state.videos.filter(v=>(v.title+" "+v.info).toLowerCase().includes(query));list=list.slice().sort((a,b)=>state.sort==="popular"?(Number(b.view||0)-Number(a.view||0)):(Number(b.created_at||0)-Number(a.created_at||0)));state.filtered=list;$("resultCount").textContent="共 "+list.length+" 个视频";const grid=$("grid");grid.innerHTML="";if(!list.length){grid.innerHTML='<div class="empty"><strong>'+(state.videos.length?"没有找到相关视频":"这里还没有视频")+'</strong>'+(state.videos.length?"试试其他搜索词。":"登录后可以投稿第一条视频。")+'</div>';return}for(const v of list){const card=document.createElement("article");card.className="card";const cover=v.avatar?'<img src="'+esc(v.avatar)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div class="cover-placeholder">▶</div>';card.innerHTML='<div class="cover">'+cover+'<button class="play" aria-label="播放 '+esc(v.title)+'">▶</button></div><div class="card-body"><h3 title="'+esc(v.title)+'">'+esc(v.title)+'</h3><p>'+esc(v.info||"暂无简介")+'</p><div class="card-meta"><span>'+Number(v.view||0).toLocaleString()+" 次播放"+'</span><span>'+esc(formatDate(v.created_at))+'</span></div></div>';card.querySelector(".play").addEventListener("click",()=>openVideo(v));card.querySelector(".cover").addEventListener("click",e=>{if(!e.target.closest("button"))openVideo(v)});grid.appendChild(card)}}
function openVideo(v){$("playerTitle").textContent=v.title||"视频播放";$("playerMeta").textContent=Number(v.view||0).toLocaleString()+" 次播放 · "+formatDate(v.created_at);$("playerInfo").textContent=v.info||"暂无简介";const video=$("videoPlayer");video.pause();video.removeAttribute("src");video.load();if(v.url){video.src=v.url;video.load()}else{$("playerArea").innerHTML='<div class="empty">视频地址不可用。若这是 OSS 视频，请检查服务端 OSS 配置。</div>'}show("playerModal")}
function show(id){$(id).classList.add("show");document.body.style.overflow="hidden"}function hide(id){$(id).classList.remove("show");if(!document.querySelector(".overlay.show"))document.body.style.overflow=""}
async function loadVideos(){try{const data=await request("/api/v1/videos?limit=100&start=0");state.videos=(data.data&&data.data.items)||[];$("resultCount").textContent="共 "+(data.data&&data.data.total||0)+" 个视频";if(state.videos.length){const first=state.videos.slice().sort((a,b)=>Number(b.view||0)-Number(a.view||0))[0];$("heroTitle").textContent=first.title;$("heroInfo").textContent=first.info||"点击播放，开始观看。";$("heroMeta").textContent=Number(first.view||0).toLocaleString()+" 次播放";$("heroPlay").onclick=()=>openVideo(first)}else{$("heroTitle").textContent="欢迎来到 G站视频";$("heroInfo").textContent="登录后投稿一条你有权发布的视频，视频将在这里展示。";$("heroPlay").onclick=()=>state.user?show("uploadModal"):show("accountModal")}render()}catch(e){$("heroTitle").textContent="服务暂时不可用";$("heroInfo").textContent="请确认后端、MySQL 与 Redis 已启动，然后刷新页面。";$("resultCount").textContent=e.message;$("grid").innerHTML='<div class="empty"><strong>连接失败</strong>'+esc(e.message)+'</div>'}}
async function loadUser(){try{const data=await request("/api/v1/user/me");state.user=data.data;$("accountName").textContent=(state.user&&state.user.nickname)||"";$("loginBtn").classList.add("hidden");$("uploadBtn").classList.remove("hidden");$("logoutBtn").classList.remove("hidden")}catch(e){state.user=null;$("accountName").textContent="";$("loginBtn").classList.remove("hidden");$("uploadBtn").classList.add("hidden");$("logoutBtn").classList.add("hidden")}}
function accountMessage(text,isError){$("accountNotice").textContent=text;$("accountNotice").className="notice "+(isError?"error":"success")}
$("search").addEventListener("input",render);document.querySelectorAll(".sort").forEach(b=>b.addEventListener("click",()=>{state.sort=b.dataset.sort;document.querySelectorAll(".sort").forEach(x=>x.classList.toggle("active",x===b));render()}));
$("loginBtn").addEventListener("click",()=>show("accountModal"));$("uploadBtn").addEventListener("click",()=>show("uploadModal"));$("logoutBtn").addEventListener("click",async()=>{try{await request("/api/v1/user/logout",{method:"DELETE"});await loadUser()}catch(e){alert(e.message)}});
$("showRegister").addEventListener("click",()=>{$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");$("accountTitle").textContent="创建账号";$("accountSwitch").classList.add("hidden");accountMessage("用户名 5–30 位，密码 8–40 位。",false)});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget);try{await request("/api/v1/user/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_name:form.get("user_name"),password:form.get("password")})});hide("accountModal");e.currentTarget.reset();await loadUser()}catch(err){accountMessage(err.message,true)}});
$("registerForm").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget);try{await request("/api/v1/user/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname:form.get("nickname"),user_name:form.get("user_name"),password:form.get("password"),password_confirm:form.get("password_confirm")})});$("loginForm").classList.remove("hidden");$("registerForm").classList.add("hidden");$("accountTitle").textContent="账号已创建，请登录";$("accountSwitch").classList.remove("hidden");$("loginUser").value=form.get("user_name");$("loginPass").value="";e.currentTarget.reset();accountMessage("注册成功，请使用新账号登录。",false)}catch(err){accountMessage(err.message,true)}});
$("uploadForm").addEventListener("submit",async e=>{e.preventDefault();const form=new FormData(e.currentTarget);$("uploadMessage").textContent="正在提交…";try{await request("/api/v1/videos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:form.get("title"),info:form.get("info"),url:form.get("url"),avatar:form.get("avatar")})});$("uploadMessage").textContent="投稿成功。";$("uploadMessage").className="hint success";e.currentTarget.reset();await loadVideos();setTimeout(()=>hide("uploadModal"),700)}catch(err){$("uploadMessage").textContent=err.message;$("uploadMessage").className="hint error"}});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>hide(b.dataset.close)));document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)hide(o.id)}));document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".overlay.show").forEach(o=>hide(o.id))});
Promise.all([loadUser(),loadVideos()]);
</script>
</body>
</html>
